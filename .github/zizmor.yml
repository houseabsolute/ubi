rules:
  # The lint workflow builds nothing that is ever published - it only runs
  # precious - so a poisoned cache cannot reach a release artifact.
  cache-poisoning:
    ignore:
      - lint.yml
  # The point of the Alpine job is to catch breakage against a current
  # rust:alpine. Pinning the image to a digest would freeze it and defeat the
  # test.
  unpinned-images:
    ignore:
      - ci.yml
  # zizmor suggests `gh release` instead of softprops/action-gh-release. Using the action keeps the
  # release job doing exactly what houseabsolute/actions-rust-release was doing before the release
  # moved out of the test matrix, including the draft handling and the upsert behavior on re-runs.
  superfluous-actions:
    ignore:
      - ci.yml
