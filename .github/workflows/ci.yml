name: Tests and release

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "ubi-*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A tag run is a release, so it is never cancelled part way through creating one.
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CRATE_NAME: ubi
  GITHUB_TOKEN: ${{ github.token }}
  RUST_BACKTRACE: 1

jobs:
  test-matrix:
    name: ${{ matrix.platform.os-name }} with rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Platforms that don't work:
          #
          # - sparc64-unknown-linux-gnu - cannot compile openssl-sys
          # - x86_64-unknown-illumos - weird error compiling openssl - "bin/sh: 1: granlib: not found"

          - os-name: FreeBSD-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-freebsd
            skip-tests: true
          - os-name: Linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os-name: Linux-x86_64 (native-tls)
            runs-on: ubuntu-24.04
            # We need to use gnu or we cannot link against openssl.
            target: x86_64-unknown-linux-gnu
            features: native-tls
          - os-name: Linux-x86_64 (native-tls-vendored)
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            features: native-tls-vendored
          - os-name: Linux-aarch64
            runs-on: ubuntu-24.04
            target: aarch64-unknown-linux-musl
          - os-name: Linux-arm
            runs-on: ubuntu-24.04
            target: arm-unknown-linux-musleabi
          - os-name: Linux-i686
            runs-on: ubuntu-24.04
            target: i686-unknown-linux-musl
            skip-tests: true
          - os-name: Linux-powerpc
            runs-on: ubuntu-24.04
            target: powerpc-unknown-linux-gnu
            skip-tests: true
          - os-name: Linux-powerpc64
            runs-on: ubuntu-24.04
            target: powerpc64-unknown-linux-gnu
            skip-tests: true
          - os-name: Linux-powerpc64le
            runs-on: ubuntu-24.04
            target: powerpc64le-unknown-linux-gnu
            skip-tests: true
          - os-name: Linux-riscv64
            runs-on: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
          - os-name: Linux-s390x
            runs-on: ubuntu-24.04
            target: s390x-unknown-linux-gnu
            skip-tests: true
          - os-name: NetBSD-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-netbsd
            skip-tests: true
            # Use a cross git commit that includes the fix for -lexecinfo on NetBSD
            # (not yet in a released version of cross).
            cross-version: 588b3c99db52b5a9c5906fab96cfadcf1bde7863
          - os-name: Windows-aarch64
            runs-on: windows-latest
            target: aarch64-pc-windows-msvc
            skip-tests: true
          - os-name: Windows-i686
            runs-on: windows-latest
            target: i686-pc-windows-msvc
            skip-tests: true
          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
          - os-name: macOS-x86_64
            runs-on: macOS-latest
            target: x86_64-apple-darwin
          - os-name: macOS-aarch64
            runs-on: macOS-latest
            target: aarch64-apple-darwin
        toolchain:
          - stable
        include:
          - platform:
              os-name: Linux-x86_64
              runs-on: ubuntu-24.04
              target: x86_64-unknown-linux-musl
              bin: ubi
            toolchain: beta
          - platform:
              os-name: Linux-x86_64
              runs-on: ubuntu-24.04
              target: x86_64-unknown-linux-musl
              bin: ubi
            toolchain: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set "--features" flag value
        id: set-features-flag-value
        shell: bash
        env:
          FEATURES: ${{ matrix.platform.features }}
        run: |
          if [ -n "$FEATURES" ]; then
              echo "features=$FEATURES" >> "$GITHUB_OUTPUT"
          else
              echo "features=default" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Maybe install SSL packages
        run: sudo apt-get update --yes && sudo apt-get install --yes pkg-config openssl libssl-dev
        if: matrix.platform.features == 'native-tls'
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: "build"
          target: ${{ matrix.platform.target }}
          toolchain: ${{ matrix.toolchain }}
          args:
            "--locked --release --features ${{ steps.set-features-flag-value.outputs.features }}"
          strip: true
          cross-version: ${{ matrix.platform.cross-version }}
      - name: Run tests
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: "test"
          target: ${{ matrix.platform.target }}
          toolchain: ${{ matrix.toolchain }}
          args:
            "--locked --release  --features ${{ steps.set-features-flag-value.outputs.features }}"
        if: ${{ !matrix.platform.skip-tests }}
      - name: Package artifacts
        uses: houseabsolute/actions-rust-release@9e126fd5fc18f4cecf358b3909f3991ad59663dc # v1.0.1
        with:
          executable-name: ubi
          target: ${{ matrix.platform.target }}
        if: matrix.toolchain == 'stable' && matrix.platform.features == ''

  test-alpine:
    name: Alpine Linux
    runs-on: ubuntu-24.04
    container:
      image: rust:alpine
      env:
        GITHUB_TOKEN: ${{ github.token }}
      volumes:
        - "${{ github.workspace }}:/workspace"
      options: "--workdir /workspace"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install packages on Alpine
        shell: sh
        run: |
          apk update
          # file is used in an integration test
          apk add file musl-dev zstd-dev
      - name: Run tests
        shell: sh
        run: cargo test --locked

  library-features:
    name: Build the library with each feature combination
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      # Every other job builds the whole workspace, which means `ubi-cli` always turns on the
      # library's `logging` feature for them. That hides breakage in the feature combinations that
      # library users actually get, since `logging` is not on by default. Building the library on
      # its own catches it.
      - name: Build the library with each feature combination
        run: |
          set -e
          for features in \
              "" \
              "--no-default-features" \
              "--features logging" \
              "--no-default-features --features logging" \
              "--no-default-features --features rustls-tls" \
              "--all-features"; do
              echo "==> cargo build -p ubi --locked $features"
              # This is intentionally unquoted so that each flag is a separate argument.
              # shellcheck disable=SC2086
              cargo build -p ubi --locked $features
          done

  msrv:
    name: Verify MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install cargo-msrv
        run: |
          cargo run -p ubi-cli -- --project foresterre/cargo-msrv --in ..
      - name: Verify MSRV
        run: |
          cd ubi
          PATH=../../:"$PATH" cargo msrv verify

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    # Every target has to have packaged its archive before this can collect them, and waiting also
    # means a version that cannot build on some platform never gets a release at all.
    needs: test-matrix
    # The action checks the tag against its own `release-tag-regex` too. This is here so that a
    # push to a branch doesn't start a job that has nothing to do.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      actions: read # Lets the action ask the API which artifacts belong to this run.
      # This also covers the checkout step, which would otherwise need `contents: read` spelled out.
      contents: write # Creating the release writes to this repository.
    steps:
      # The action uses Changes.md as the body of the release, so the file has to be on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        uses: houseabsolute/actions-rust-release/publish@9e126fd5fc18f4cecf358b3909f3991ad59663dc # v1.0.1
        with:
          # This is only used to build the default `artifact-regex`, which decides which of the
          # run's artifacts are attached to the release.
          executable-name: ubi
          # The release is created as a draft so it can be reviewed before it goes out, and it is
          # not marked as the latest release, matching what this job did before.
          draft: "true"
          latest: "false"
