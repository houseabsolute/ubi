name: Test bootstrap

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "ubi-*"
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  test-bootstrap:
    name: |
      ${{ matrix.platform.os_name }} - ${{ matrix.platform.script }} - ${{ ( matrix.tag == '' && 'no tag' ) || matrix.tag }}
    runs-on: ${{ matrix.platform.os }}
    container: ${{ matrix.platform.container }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux
            os: ubuntu-24.04
            script: bootstrap-ubi.sh
          - os_name: Alpine Linux (ash)
            os: ubuntu-24.04
            container:
              image: alpine:latest
              env:
                GITHUB_TOKEN: ${{ github.token }}
              volumes:
                - "${{ github.workspace }}:/workspace"
              options: "--workdir /workspace"
            script: bootstrap-ubi.sh
          - os_name: macOS
            os: macOS-latest
            script: bootstrap-ubi.sh
          - os_name: Windows
            os: windows-latest
            script: bootstrap-ubi.ps1
          # Curl seems to be broken in this environment for some reason. See here for an example -
          # https://github.com/houseabsolute/ubi/actions/runs/10022996389/job/27703398529
          #
          # - os_name: Windows
          #   os: windows-latest
          #   script: bootstrap-ubi.sh
        tag:
          - ""
          # This tag has a two-digit patch version, which used to break the version parsing in the
          # bootstrap script. See https://github.com/houseabsolute/ubi/issues/152.
          - v0.0.15
          - v0.1.1
        exclude:
          - platform:
              os: windows-latest
            tag: v0.0.15
          - platform:
              os: windows-latest
            tag: v0.1.1
          # ubi 0.0.15 looks for "Darwin" and "aarch64" in release filenames,
          # but precious only ships precious-macOS-arm64, so it cannot resolve
          # a release on an arm64 macOS runner. There is nothing to test here.
          - platform:
              os: macOS-latest
            tag: v0.0.15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install curl and sudo on Alpine
        shell: sh
        run: |
          apk update
          apk add curl sudo
        if: matrix.platform.container != null
      - name: Run bootstrap script
        shell: sh
        env:
          SCRIPT: ${{ matrix.platform.script }}
          TAG: ${{ matrix.tag }}
        run: |
          set -e
          set -x

          if [ $( id -u ) -eq 0 ]; then
              adduser -D github
              sudo -u github ./bootstrap/test/test-bootstrap.sh "$SCRIPT" "$TAG"
          else
              ./bootstrap/test/test-bootstrap.sh "$SCRIPT" "$TAG"
          fi

          exit 0
        if: ${{ matrix.platform.script == 'bootstrap-ubi.sh' }}
      - name: Run bootstrap script
        shell: powershell
        env:
          SCRIPT: ${{ matrix.platform.script }}
        run: |
          powershell -exec bypass ./bootstrap/bootstrap-ubi.ps1

          if ( -not( Test-Path -Path "ubi.exe" ) ) {
              Write-Host "Running ./bootstrap/$env:SCRIPT did not install ubi!"
              exit 1
          }

          ./ubi.exe --project houseabsolute/precious --in "."
          if ( -not( Test-Path -Path "precious.exe" ) ) {
              Write-Host "Running ubi did not install precious!"
              exit 2
          }

          exit 0
        if: ${{ matrix.platform.script == 'bootstrap-ubi.ps1' }}
