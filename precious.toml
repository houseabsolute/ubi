exclude = [
    "target",
    "**/*.AppImage",
    "**/*.bz",
    "**/*.bz2",
    "**/*.exe",
    "**/*.gz",
    "**/*.jar",
    "**/*.phar",
    "**/*.pyz",
    "**/*.tar",
    "**/*.tar.*",
    "**/*.xz",
    "**/*.zip",
]

[commands.clippy]
type = "lint"
include = "**/*.rs"
invoke = "once"
path-args = "none"
working-dir = "root"
cmd = [
    "cargo",
    "clippy",
    "--color",
    "always",
    "--locked",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "clippy::pedantic",
    "-D",
    "warnings",
]
ok_exit_codes = 0
lint_failure_exit_codes = 101
expect_stderr = true

[commands."clippy --fix"]
type = "tidy"
include = "**/*.rs"
invoke = "once"
path-args = "none"
working-dir = "root"
cmd = [
    "cargo",
    "clippy",
    "--fix",
    "--allow-dirty",
    "--workspace",
    "--locked",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "clippy::pedantic",
]
ok_exit_codes = 0
lint_failure_exit_codes = 101
expect_stderr = true

[commands.rustfmt]
type = "both"
include = "**/*.rs"
cmd = ["rustfmt", "--edition", "2021"]
lint_flags = "--check"
ok_exit_codes = [0]
lint_failure_exit_codes = [1]

[commands.oxfmt]
type = "both"
include = ["**/*.md", "**/*.yml", "**/*.toml"]
cmd = ["oxfmt"]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = 0
lint-failure-exit-codes = 1

[commands.omegasort-gitignore]
type = "both"
include = "**/.gitignore"
cmd = ["omegasort", "--sort", "path", "--unique"]
lint-flags = "--check"
tidy-flags = "--in-place"
ok-exit-codes = 0
lint-failure-exit-codes = 1
ignore-stderr = ["The .+ file is not sorted", "The .+ file is not unique"]

[commands.shellcheck]
type = "lint"
include = "**/*.sh"
exclude = "ubi/test-data/project.sh"
cmd = "shellcheck"
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands.shfmt]
type = "both"
include = "**/*.sh"
exclude = "ubi/test-data/project.sh"
cmd = ["shfmt", "--simplify", "--indent", "4"]
lint_flags = "--diff"
tidy_flags = "--write"
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands.typos]
type = "both"
include = "**/*"
cmd = "typos"
tidy_flags = "--write-changes"
invoke = "once"
ok-exit-codes = 0
lint-failure-exit-codes = 2

[commands.zizmor]
type = "lint"
include = ".github/**/*.yml"
invoke = "once"
path-args = "none"
working-dir = "root"
# The config is passed explicitly because zizmor's auto-discovery of
# .github/zizmor.yml does not work in a git worktree, and that is how the
# pre-commit hook runs.
cmd = ["zizmor", "--persona", "pedantic", "--config", ".github/zizmor.yml", "."]
ok-exit-codes = 0
# zizmor exits with 11-14 depending on the severity of the worst finding. Every
# other non-zero code means zizmor itself failed - 1 for an audit error, 2 for
# bad arguments, 3 for collecting no inputs at all - and none of those are lint
# failures, so precious should treat them as hard errors.
lint-failure-exit-codes = [11, 12, 13, 14]
expect-stderr = true
