serde.workspace = true
serde_json.workspace = true
serial_test.workspace = true
sevenz-rust2.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
walkdir.workspace = true
which.workspace = true
xz2.workspace = true
zip.workspace = true
zstd.workspace = true

[features]
default = ["rustls-tls"]
## enables TLS via the `rustls` crate, using `ring` as the crypto provider.
##
## Note that this enables `reqwest`'s `rustls-no-provider` feature, not its `rustls` feature. The
## latter would pull in the `aws-lc-rs` crypto provider, which requires a C/C++ toolchain and does
## not cross-compile to all of the platforms `ubi` supports. Enabling this feature makes `ubi`
## install the `ring` provider as the process-wide default when it builds its HTTP client.
rustls-tls = ["reqwest/rustls-no-provider", "dep:rustls"]
## enables the `native-tls` feature for the `reqwest` crate.
native-tls = ["reqwest/native-tls"]
## enables the `native-tls-vendored` feature for the `reqwest` crate.
native-tls-vendored = ["reqwest/native-tls-vendored"]
logging = ["dep:fern"]

[dev-dependencies]
env_logger.workspace = true
fern.workspace = true
mockito.workspace = true
rstest.workspace = true
test-log.workspace = true
tokio.workspace = true

[lints]
workspace = true
