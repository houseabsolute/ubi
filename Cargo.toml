[workspace.package]
authors = ["Dave Rolsky <autarch@urth.org>"]
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/houseabsolute/ubi"
version = "0.13.0"

[workspace]
members = ["ubi", "ubi-cli"]
resolver = "2"

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false }
async-trait = { version = "0.1.92", default-features = false }
binstall-tar = { version = "0.4.42", default-features = false }
bzip2 = { version = "0.6.1" }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
document-features = { version = "0.2" }
# Used in some test code which can't use test_log.
env_logger = { version = "0.11.11", default-features = false }
fern = { version = "0.7.1", default-features = false, features = ["colored"] }
flate2 = { version = "1.1.10", default-features = false }
itertools = { version = "0.15.0" }
lazy-regex = { version = "3.6.2" }
log = { version = "0.4.34", default-features = false }
mockito = { version = "1.7.2", default-features = false }
percent-encoding = { version = "2.3.2" }
platforms = { version = "4.2.1" }
regex = { version = "1.13.1", default-features = false }
# The TLS backend is picked by the `ubi` crate's features, not here. Turning one on here would turn
# it on for every build, so a library user couldn't turn it off. In particular,
# `rustls-no-provider` with no provider installed makes reqwest panic when we build the client. See
# the `rustls-tls` feature in `ubi/Cargo.toml`.
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "json"] }
rstest = { version = "0.27.0", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false }
serial_test = { version = "4.0.1", default-features = false }
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["util"] }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = { version = "3.27.0", default-features = false }
test-case = { version = "3.4.0" }
test-log = { version = "0.2.21", default-features = false }
thiserror = { version = "2.0.21" }
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt"] }
url = { version = "2.5.8", default-features = false, features = ["serde"] }
walkdir = { version = "2.5.0", default-features = false }
which = { version = "8.0.6" }
# The `static` feature makes `lzma-sys` compile liblzma from source and link it statically. Without
# it, `lzma-sys` uses pkg-config to find a system liblzma and links against it dynamically. On the
# macOS release builders that finds Homebrew's `xz`, producing binaries that only run on machines
# with that same Homebrew package installed. See
# https://github.com/houseabsolute/ubi/issues/151.
xz2 = { version = "0.1.7", default-features = false, features = ["static"] }
# Both the `bzip2` and `lzma`/`xz` features here are pure Rust - `bzip2` maps to `bzip2/default`,
# which uses `libbz2-rs-sys`, and the lzma features use `lzma-rust2`. Do not switch `bzip2` to
# `bzip2-rs`, despite the name: that selects the C `bzip2-sys`, which pkg-config-probes for a system
# libbz2 and can end up dynamically linked, the same way liblzma did in #151.
zip = { version = "9.0.5", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate",
    "deflate64",
    "lzma",
    "xz",
    "zstd",
] }
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.clippy]
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
